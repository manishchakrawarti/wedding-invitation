name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "invite-all-1.0.${VERSION_CODE}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "invite-all-1.0.${VERSION_CODE}.aab"
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "invite-all-1.0.${VERSION_CODE}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: invite-all-android-${{ github.run_number }}
          path: |
            android/invite-all-*.apk
            android/invite-all-*.aab
